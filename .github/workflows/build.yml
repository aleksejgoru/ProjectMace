name: Build Fabric Mod 26.2

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Download Gradle Manually
        run: |
          wget -q https://services.gradle.org/distributions/gradle-9.5.1-bin.zip
          unzip -q gradle-9.5.1-bin.zip
          chmod +x gradle-9.5.1/bin/gradle
          
      - name: Build with Gradle
        run: ./gradle-9.5.1/bin/gradle build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: mace-mod-jar
          path: build/libs/*.jar
          if-no-files-found: error
